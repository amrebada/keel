[workspace]
resolver = "2"
members = ["crates/*", "plugins/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
repository = "https://github.com/amrebada/keel"
rust-version = "1.85"

[workspace.dependencies]
keel-sdk = { path = "crates/keel-sdk", version = "0.1.0" }
keel-core = { path = "crates/keel-core", version = "0.1.0" }
keel-providers = { path = "crates/keel-providers", version = "0.1.0" }
anyhow = "1"
argon2 = "0.5"
base64 = "0.22"
getrandom = "0.2"
hmac = "0.12"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
sha1 = "0.10"
sha2 = "0.10"
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
jsonschema = { version = "0.62", default-features = false }
redis = { version = "0.27", default-features = false, features = ["tokio-comp", "connection-manager"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "any", "sqlite", "postgres", "mysql", "json"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "fs"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
http-body-util = "0.1"
