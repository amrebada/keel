# Sample Keel app. Only compiled-in plugins can be listed here; see them with
# `keel plugins list`.
app: team-tasks
server:
  host: 127.0.0.1
  port: 8080

providers:
  db: { use: postgres, url: "${secret:DATABASE_URL}" }
  cache: { use: memory }
  email: { use: console, from: "Team Tasks <noreply@localhost>" }

plugins:
  - use: ping@^0.1
    config:
      message: pong from team-tasks
  - use: saas-auth@^1
    config:
      mfa: false
      roles:
        admin: { permissions: ["*"] }
        owner: { permissions: ["tasks.*", "rbac.manage"], inherits: [member] }
        member: { permissions: ["tasks.read"] }
  - use: resource
    config:
      resources:
        tasks:
          scope: tenant
          fields:
            title: { type: string, required: true, max_length: 120 }
            done: { type: boolean, default: false }
            due: { type: date }

routes:
  /admin/**: { guard: [authenticated, "role:admin"] }
  /ping: { guard: ["rate-limit:60/min"] }
  # /api/tasks needs tasks.read / tasks.write / tasks.delete by default (resource access: permissions)
  "POST /api/tasks": { guard: ["rate-limit:60/min"] }
