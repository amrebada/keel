# Sample Keel app. Only compiled-in plugins can be listed here; see them with
# `keel plugins list`. Auth, roles and the rest arrive in later phases.
app: team-tasks
server:
  host: 127.0.0.1
  port: 8080

providers:
  db: { use: postgres, url: "${secret:DATABASE_URL}" }
  cache: { use: memory }

plugins:
  - use: ping@^0.1
    config:
      message: pong from team-tasks

routes:
  /admin/**: { guard: [authenticated, "role:admin"] }
