id: auth-mfa
version: 0.1.0
summary: Second factor for auth-core logins - TOTP authenticator apps and one-time recovery codes, with replay protection and lockout after failed codes.
requires:
  host: "^0.1"
  capabilities: [sql, crypto, log]
  plugins:
    auth-core: "^0.1"
provides:
  routes:
    - GET /auth/mfa/status
    - POST /auth/mfa/totp/setup
    - POST /auth/mfa/totp/confirm
    - POST /auth/mfa/verify
    - POST /auth/mfa/disable
    - POST /auth/mfa/recovery-codes
  events: [auth.mfa.enabled, auth.mfa.disabled]
config: config.schema.json
runtime_config: []
migrations: built-in
degrade_level: error
