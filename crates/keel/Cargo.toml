[package]
name = "keel"
description = "Keel: a pluggable Rust backend you configure in YAML"
version.workspace = true
edition.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "keel"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
keel-core.workspace = true
keel-providers.workspace = true
keel-sdk.workspace = true
reqwest.workspace = true
serde.workspace = true
sha2.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
tokio = { workspace = true, features = ["process", "io-util"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# keel:plugins (managed by `keel new-plugin`; one line per compiled-in plugin)
keel-plugin-auth-core = { path = "../../plugins/auth-core" }
keel-plugin-billing-stripe = { path = "../../plugins/billing-stripe" }
keel-plugin-auth-mfa = { path = "../../plugins/auth-mfa" }
keel-plugin-auth-oauth = { path = "../../plugins/auth-oauth" }
keel-plugin-ping = { path = "../../plugins/ping" }
keel-plugin-rbac = { path = "../../plugins/rbac" }
keel-plugin-resource = { path = "../../plugins/resource" }
keel-plugin-saas-auth = { path = "../../plugins/saas-auth" }
# keel:plugins:end

[dev-dependencies]
tempfile = "3"
libc = "0.2"
