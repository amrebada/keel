[package]
name = "keel"
description = "Keel: a pluggable Rust backend you configure in YAML"
version.workspace = true
edition.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "keel"
path = "src/main.rs"

[dependencies]
keel-core.workspace = true
keel-sdk.workspace = true
serde_json.workspace = true

# keel:plugins (managed by `keel new-plugin`; one line per compiled-in plugin)
keel-plugin-ping = { path = "../../plugins/ping" }
# keel:plugins:end
anyhow.workspace = true
clap.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile = "3"
