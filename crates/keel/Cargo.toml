[package]
name = "keel"
description = "Keel: a pluggable Rust backend you configure in YAML"
version.workspace = true
edition.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "keel"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
keel-core.workspace = true
keel-providers.workspace = true
keel-sdk.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true

# keel:plugins (managed by `keel new-plugin`; one line per compiled-in plugin)
keel-plugin-auth-core = { path = "../../plugins/auth-core" }
keel-plugin-auth-oauth = { path = "../../plugins/auth-oauth" }
keel-plugin-ping = { path = "../../plugins/ping" }
# keel:plugins:end

[dev-dependencies]
tempfile = "3"
